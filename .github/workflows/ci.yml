name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore src/WSApi.Client.sln

      - name: Build
        run: dotnet build src/WSApi.Client.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/WSApi.Client.sln --configuration Release --no-build

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore src/WSApi.Client.sln

      - name: Check style
        run: dotnet format style src/WSApi.Client.sln --verify-no-changes

      - name: Run analyzers
        run: dotnet format analyzers src/WSApi.Client.sln --verify-no-changes

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore src/WSApi.Client.sln

      - name: Build
        run: dotnet build src/WSApi.Client.sln --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/WSApi.Client/WSApi.Client.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
