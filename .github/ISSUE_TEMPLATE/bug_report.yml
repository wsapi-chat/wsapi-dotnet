name: Bug Report
description: Report a bug in the WSAPI .NET SDK
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Configure the client with ...
        2. Call `client.Messages.SendTextMessage(...)`
        3. Observe error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or stack traces if available.
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: SDK Version
      description: Which version of WSApi.Client are you using?
      placeholder: "3.0.0"
    validations:
      required: true

  - type: dropdown
    id: dotnet-version
    attributes:
      label: .NET Version
      options:
        - .NET 9.0
        - .NET 8.0
        - .NET 7.0
    validations:
      required: true

  - type: dropdown
    id: integration-type
    attributes:
      label: Integration Type
      description: How are you integrating with the SDK?
      options:
        - HTTP (API calls only)
        - Webhook (receiving events)
        - SSE (Server-Sent Events)
        - Multiple / Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Any additional environment details (OS, hosting platform, etc.)
      placeholder: "e.g., Windows 11, running in Azure App Service"
    validations:
      required: false
